<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../src/css/main.css" />
  <script defer src="../../src/js/fontawesomeall.min.js"></script>
  <title>1.5 Font Awesome icons</title>
 </head>
 <body>
  <section class="section">
    <div class="container">
      <h1 class="title">1.5 Font Awesome — өөр өөр дүрс</h1>
      <div class="buttons">
        <button class="button is-primary"><i class="fas fa-search" data-fa-transform="shrink-1"></i></button>
        <button class="button is-secondary is-large"><i class="fas fa-search" data-fa-transform="grow-5"></i></button>
        <button class="button is-danger"><i class="fas fa-heart"></i></button>
        <button class="button is-link"><i class="fas fa-house"></i></button>
        <button class="button is-warning"><i class="fas fa-user"></i></button>
        <button class="button is-dark"><i class="fas fa-gear"></i></button>
        <button class="button is-info"><i class="fas fa-envelope"></i></button>
        <button class="button is-success"><i class="fas fa-calendar"></i></button>
        <button class="button is-light"><i class="fas fa-book"></i></button>
        <button class="button is-danger"><i class="fas fa-trash"></i></button>
      </div>
    </div>
  </section>
 </body>
</html>
